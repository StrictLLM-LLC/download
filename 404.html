<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Resolving StrictLLM Download</title>
    <meta
      name="description"
      content="Redirecting stable StrictLLM download URLs to the latest published GitHub release asset."
    />
    <style>
      :root {
        color-scheme: light;
        --surface: rgba(255, 251, 245, 0.9);
        --surface-strong: #fffdfa;
        --line: rgba(72, 52, 29, 0.14);
        --ink: #1f1a17;
        --muted: #6f655d;
        --accent: #b64a25;
        --shadow: 0 24px 80px rgba(87, 52, 19, 0.12);
        --radius-xl: 28px;
        --radius-lg: 18px;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        font-family: "Avenir Next", "Segoe UI", sans-serif;
        color: var(--ink);
        background:
          radial-gradient(circle at top left, rgba(255, 214, 153, 0.55), transparent 36%),
          radial-gradient(circle at top right, rgba(182, 74, 37, 0.2), transparent 28%),
          linear-gradient(180deg, #f7f2ea 0%, #efe4d5 100%);
      }

      main {
        width: min(680px, 100%);
        padding: 28px;
        border: 1px solid var(--line);
        border-radius: var(--radius-xl);
        background: linear-gradient(145deg, rgba(255, 252, 247, 0.95), rgba(248, 236, 223, 0.92));
        box-shadow: var(--shadow);
      }

      .status-card,
      .panel {
        border: 1px solid var(--line);
        border-radius: var(--radius-lg);
        background: var(--surface);
      }

      .status-card,
      .panel,
      .loading,
      .error {
        padding: 18px;
      }

      h1,
      p {
        margin: 0;
      }

      h1 {
        margin-bottom: 12px;
        font-size: clamp(2rem, 6vw, 3.5rem);
        line-height: 0.95;
        letter-spacing: -0.04em;
      }

      p {
        line-height: 1.6;
        color: var(--muted);
      }

      .stack {
        display: grid;
        gap: 16px;
        margin-top: 22px;
      }

      .button {
        display: inline-flex;
        margin-top: 18px;
        border-radius: 999px;
        padding: 14px 18px;
        font-weight: 700;
        color: #fff;
        background: var(--accent);
        text-decoration: none;
      }

      .error,
      .loading {
        border: 1px solid var(--line);
        border-radius: 14px;
        background: var(--surface-strong);
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Resolving Download</h1>
      <p>
        This stable URL is being matched against the latest public StrictLLM desktop release.
      </p>

      <div class="stack">
        <section class="status-card">
          <p id="detected-platform">Checking requested asset…</p>
          <p id="detected-copy">Looking up the latest public installer on GitHub.</p>
          <a class="button" id="primary-download" href="https://download.strictllm.com/">Browse downloads</a>
        </section>

        <section class="panel">
          <p id="release-summary">Loading published assets…</p>
          <div id="latest-grid" class="loading">Fetching release metadata from GitHub…</div>
          <div id="release-list" style="display: none;"></div>
        </section>
      </div>
    </main>

    <script src="/app.js"></script>
  </body>
</html>
