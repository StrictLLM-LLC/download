<!DOCTYPE html>
<html class="dark" lang="en">
  <head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>StrictLLM Download Redirect</title>
    <link rel="apple-touch-icon" href="https://strictllm.com/assets/favicon/apple-touch-icon.png" />
    <link
      rel="icon"
      type="image/png"
      href="https://strictllm.com/assets/favicon/favicon-32x32.png"
      sizes="32x32"
    />
    <link
      rel="icon"
      type="image/png"
      href="https://strictllm.com/assets/favicon/favicon-16x16.png"
      sizes="16x16"
    />
    <link rel="icon" href="https://strictllm.com/assets/favicon/favicon.ico" />
    <link rel="manifest" href="https://strictllm.com/assets/favicon/site.webmanifest" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&amp;family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
      rel="stylesheet"
    />
    <script>
      (function() {
        try {
          const savedTheme = localStorage.getItem("theme");
          const systemDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
          const theme = savedTheme || (systemDark ? "dark" : "light");
          document.documentElement.classList.remove("dark", "light");
          document.documentElement.classList.add(theme);
        } catch (error) {
          console.error("Theme init error:", error);
        }
      })();
    </script>
    <link href="https://strictllm.com/assets/styles.css" rel="stylesheet" />
  </head>
  <body
    data-page="download-route"
    class="min-h-screen bg-background-light text-slate-900 antialiased selection:bg-primary/30 dark:bg-background-dark dark:text-slate-100"
  >
    <main class="relative flex min-h-screen items-center justify-center px-6 py-16">
      <div class="hero-glow"></div>
      <div class="w-full max-w-2xl rounded-3xl border border-border-dark bg-card-dark/90 p-10 text-center shadow-2xl">
        <div
          data-download-route-icon
          class="mx-auto mb-6 flex h-16 w-16 items-center justify-center rounded-2xl bg-primary/10 text-white"
        >
          <span class="material-symbols-outlined text-4xl text-primary">download</span>
        </div>
        <h1 data-download-route-title class="mb-4 text-3xl font-black text-white">Resolving download</h1>
        <p data-download-route-status class="mx-auto max-w-xl text-base text-slate-400">
          Checking whether this URL matches the latest published StrictLLM installer.
        </p>
        <div class="mt-8">
          <a
            data-download-route-link
            class="hidden inline-flex items-center justify-center rounded-xl border border-primary/20 bg-primary/10 px-6 py-3 text-sm font-semibold text-primary transition-all hover:bg-primary/20"
            href="/"
            >Back to downloads</a
          >
        </div>
      </div>
    </main>
    <script>
      window.STRICTLLM_DOWNLOAD_CONFIG = {
        downloadPageUrl: "/",
        latestReleaseUrl: "https://api.github.com/repos/StrictLLM-LLC/download/releases/latest",
      };
    </script>
    <script src="/assets/download-page.js"></script>
  </body>
</html>
